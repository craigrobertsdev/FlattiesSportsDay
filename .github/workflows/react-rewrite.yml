name: Build and deploy Node.js app to Azure Web App - flatties-sports-day

on:
  push:
    branches:
      - react-rewrite
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build React client
        run: |
          npm install --prefix app/client
          npm run build --prefix app/client

      - name: Install server dependencies
        run: npm install --prefix app/server --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/client/dist
          cp -r app/server/. deploy/
          cp -r app/client/dist/. deploy/client/dist/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Set Node.js startup command
        run: |
          az webapp config set \
            --name flatties-sports-day \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --startup-file "node index.js"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flatties-sports-day'
          slot-name: 'Production'
          package: deploy


